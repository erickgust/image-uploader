# Free Supabase projects pause after inactivity; a periodic request keeps this one awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: '0 12 */3 * *' # every 3 days
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/images?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
